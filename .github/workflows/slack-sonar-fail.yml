jobs:
  send-blockkit:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare payload and send Slack Block Kit message
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref }}
          # workflow_dispatch inputs
          ASSIGNEE: ${{ github.event.inputs.assignee }}
          INPUT_MESSAGE: ${{ github.event.inputs.message }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "ERROR: SLACK_WEBHOOK_URL secret is not set. Add it to repo secrets."
            exit 1
          fi

          # Compute branch name (fallback)
          BRANCH="${REF##*/}"
          # Use provided message or fallback to default (INPUT_MESSAGE already contains default)
          MSG="${INPUT_MESSAGE:-No message provided.}"
          # Trim leading/trailing whitespace
          MSG="$(echo "$MSG" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          # Truncate if too long (Slack block limits). Keep safety margin.
          MAX_LEN=3000
          if [ "${#MSG}" -gt "$MAX_LEN" ]; then
            MSG="${MSG:0:$MAX_LEN}
(…truncated)"
          fi

          # Build Block Kit JSON safely using jq (install if missing)
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

          HEADER_TEXT="⛔ Sonar Check 실패"
          SUBTITLE="*레포:* \`$REPO\`  •  *브랜치:* \`$BRANCH\`  •  *Trigger:* \`$ACTOR\`"
          if [ -n "${ASSIGNEE:-}" ]; then
            SUBTITLE="$SUBTITLE  •  *담당자:* \`$ASSIGNEE\`"
          fi

          BRANCH_URL="https://github.com/${REPO}/tree/${BRANCH}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          # Build blocks
          BLOCKS=$(jq -nc \
            --arg header "$HEADER_TEXT" \
            --arg subtitle "$SUBTITLE" \
            --arg run_url "$RUN_URL" \
            --arg branch_url "$BRANCH_URL" \
            --arg msg "$MSG" \
            '[
              { "type":"header", "text": { "type":"plain_text", "text": $header, "emoji": true } },
              { "type":"section", "text": { "type":"mrkdwn", "text": $subtitle } },
              {
                "type": "actions",
                "elements": [
                  { "type":"button", "text": { "type":"plain_text", "text":"🔎 Actions Run 보기", "emoji": true }, "url": $run_url },
                  { "type":"button", "text": { "type":"plain_text", "text":"🌿 브랜치 보기", "emoji": true }, "url": $branch_url }
                ]
              },
              { "type":"divider" },
              {
                "type":"section",
                "text": { "type":"mrkdwn", "text": "*Details*\n```" + ($msg) + "```" }
              },
              {
                "type":"context",
                "elements": [
                  { "type":"mrkdwn", "text": "자동 알림: Sonar/CI 검사 실패 알림입니다." }
                ]
              }
            ]')

          # Build final payload
          PAYLOAD=$(jq -nc --argjson blocks "$BLOCKS" '{ blocks: $blocks }')

          # Debug: print payload size and first 400 chars
          echo "Payload length: $(echo -n "$PAYLOAD" | wc -c) bytes"
          echo "Preview:"
          echo "$PAYLOAD" | head -c 400
          echo "..."

          # Send to Slack
          curl -sS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" || {
            echo "Warning: Slack webhook call failed"
            exit 0
          }

          echo "Slack message sent."
