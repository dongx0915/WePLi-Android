name: Slack BlockKit — Sonar Failure Message

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "브랜치명 (예: release/26.11.01)"
        required: true
        default: "release/26.11.01"
      assignee:
        description: "담당자 (optional)"
        required: false
        default: ""
      message:
        description: "Slack에 보낼 원문 메시지"
        required: true
        default: ":x: Sonar Check 실패!!"

jobs:
  send-slack:
    runs-on: ubuntu-latest
    steps:
      - name: Send Block Kit message
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.event.inputs.branch }}
          ASSIGNEE: ${{ github.event.inputs.assignee }}
          INPUT_MESSAGE: ${{ github.event.inputs.message }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "ERROR: SLACK_WEBHOOK_URL secret is not set."
            exit 1
          fi

          # jq 설치 (없을 때만)
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

          # 메시지 트렁케이트 (Slack 제한 회피)
          MSG="${INPUT_MESSAGE}"
          MAX_LEN=2800
          if [ "${#MSG}" -gt "$MAX_LEN" ]; then
            MSG="${MSG:0:$MAX_LEN}(…truncated)"
          fi

          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          BRANCH_URL="https://github.com/${REPO}/tree/${BRANCH}"

          SUBTITLE="*브랜치:* \`${BRANCH}\`  •  *레포:* \`${REPO}\`  •  *Trigger:* \`${ACTOR}\`"
          if [ -n "${ASSIGNEE:-}" ]; then
            SUBTITLE="${SUBTITLE}  •  *담당자:* \`${ASSIGNEE}\`"
          fi

          # ✅ 핵심 수정: jq에서 + 연결 대신 문자열 보간 \(... ) 사용
          BLOCKS=$(jq -nc \
            --arg header "⛔ Sonar Check 실패" \
            --arg subtitle "$SUBTITLE" \
            --arg run_url "$RUN_URL" \
            --arg branch_url "$BRANCH_URL" \
            --arg msg "$MSG" \
            '[
              { "type":"header",
                "text": { "type":"plain_text", "text": $header, "emoji": true }
              },
              { "type":"section",
                "text": { "type":"mrkdwn", "text": $subtitle }
              },
              { "type":"actions",
                "elements":[
                  { "type":"button",
                    "text": { "type":"plain_text", "text":"🔎 Actions Run 보기", "emoji": true },
                    "url": $run_url
                  },
                  { "type":"button",
                    "text": { "type":"plain_text", "text":"🌿 브랜치 보기", "emoji": true },
                    "url": $branch_url
                  }
                ]
              },
              { "type":"divider" },
              { "type":"section",
                "text": { "type":"mrkdwn",
                          "text": "*Details*\n```\n\($msg)\n```"
                        }
              }
            ]')

          PAYLOAD=$(jq -nc --argjson blocks "$BLOCKS" '{ blocks: $blocks }')

          curl -sS -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
