      assignee:
        description: '담당자 (optional)'
        required: false
      message:
        description: '보낼 메시지 (optional, 기본값은 예제 텍스트)'
        required: false
        default: |
          :x:[AndroidTV:tv:] Sonar Check 실패!! ㅠㅠ 
          [QE-374] 광고 플레이어 > 컴포넌트 ON > 하단 방향키 클릭 시 컴포넌트 OFF 안 됨 (#384) README.md app benchmark build build-logic build.gradle.kts cjhv_tvingstick.keystore core feature flipper-buildvariant-implement.gradle flipperandroidnoop gaudioLab git-hook-files git-hook-files-script.gradle gradle gradle-build-variant.gradle gradle.properties gradlew gradlew.bat sentry.properties settings.gradle.kts tvUtils [QE-374] 광고 플레이어 컨트롤러 ON 상태에서 하단 방향키로 OFF 처리 Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com> README.md app benchmark build build-logic build.gradle.kts cjhv_tvingstick.keystore core feature flipper-buildvariant-implement.gradle flipperandroidnoop gaudioLab git-hook-files git-hook-files-script.gradle gradle gradle-build-variant.gradle gradle.properties gradlew gradlew.bat sentry.properties settings.gradle.kts tvUtils [QE-334] 티빙톡 에러 문구 가로 Max width 319 → 390 변경 Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com> README.md app benchmark build build-logic build.gradle.kts cjhv_tvingstick.keystore core feature flipper-buildvariant-implement.gradle flipperandroidnoop gaudioLab git-hook-files git-hook-files-script.gradle gradle gradle-build-variant.gradle gradle.properties gradlew gradlew.bat sentry.properties settings.gradle.kts tvUtils Revert "[QE-334] 티빙톡 에러 문구 가로 Max width 319 → 390 변경" This reverts commit 6397d8d2988f09b7c0fc9befa707b69dc850912b. --------- Co-authored-by: Claude Opus 4.6 <noreply@anthropic.com> 
