name: Discord로 Debug APK 자동 배포

on:
  create:
    branches:
      - 'release/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'create' && github.ref_type == 'branch' && startsWith(github.ref_name, 'release/'))
    
    steps:
    - name: 📥 저장소 체크아웃
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ☕ JDK 17 설정
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'adopt'

    - name: 💾 Gradle 패키지 캐시
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: 🔑 Gradlew 실행 권한 부여
      run: chmod +x gradlew

    - name: 📄 Google Services JSON 파일 생성
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
        else
          echo "Warning: GOOGLE_SERVICES_JSON secret not found. Creating dummy file."
          echo '{}' > app/google-services.json
        fi

    - name: ⚙️ Local Properties 파일 생성
      run: |
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
        echo "SUPABASE_CLIENT_ID=${{ secrets.SUPABASE_CLIENT_ID }}" >> local.properties
        echo "APPLE_MUSIC_URL=${{ secrets.APPLE_MUSIC_URL }}" >> local.properties
        echo "APPLE_MUSIC_API_TOKEN=${{ secrets.APPLE_MUSIC_API_TOKEN }}" >> local.properties
        echo "POSTMAN_URL=${{ secrets.POSTMAN_URL }}" >> local.properties

    - name: 🔨 Debug APK 빌드
      run: ./gradlew assembleDebug --stacktrace

    - name: 📱 APK 정보 수집
      id: apk_info
      run: |
        APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
        APK_NAME=$(basename "$APK_PATH")
        
        echo "apk_path=${APK_PATH}" >> $GITHUB_OUTPUT
        echo "apk_size=${APK_SIZE}" >> $GITHUB_OUTPUT
        echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

    - name: 📋 앱 버전 정보 추출
      id: version_info
      run: |
        APP_VERSION=$(grep "appVersion" gradle/libs.versions.toml | cut -d'"' -f2)
        VERSION_CODE=$(grep "versionCode" gradle/libs.versions.toml | cut -d'"' -f2)
        
        # 브랜치 이름에서 버전 추출 (예: release/1.0.0)
        if [ "${{ github.event_name }}" = "create" ]; then
          BRANCH_NAME="${{ github.ref_name }}"
          if [[ "$BRANCH_NAME" =~ ^release/(.+)$ ]]; then
            RELEASE_VERSION="${BASH_REMATCH[1]}"
          else
            RELEASE_VERSION="$APP_VERSION"
          fi
        else
          RELEASE_VERSION="$APP_VERSION"
        fi
        
        # 태그 이름 생성 (예: v1.0.0-debug)
        TAG_NAME="v${RELEASE_VERSION}-debug"
        
        echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT
        echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
        echo "release_version=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
        echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
        echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

    - name: 📦 GitHub Release 생성
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version_info.outputs.tag_name }}
        release_name: 🚀 WePLi Debug APK v${{ steps.version_info.outputs.release_version }}
        body: |
          ## 🚀 WePLi Android Debug APK 배포
          
          ### 📱 APK 정보
          - **버전**: v${{ steps.version_info.outputs.release_version }}
          - **버전 코드**: ${{ steps.version_info.outputs.version_code }}
          - **파일명**: `${{ steps.apk_info.outputs.apk_name }}`
          - **크기**: ${{ steps.apk_info.outputs.apk_size }}
          - **브랜치**: ${{ steps.version_info.outputs.branch_name }}
          
          ### 📅 빌드 정보
          - **빌드 시간**: $(date '+%Y-%m-%d %H:%M:%S')
          - **빌드 환경**: GitHub Actions
          
          ### 📥 다운로드
          아래 Assets에서 APK 파일을 다운로드할 수 있습니다.
          
          ---
          🤖 *Automated by GitHub Actions*
        draft: false
        prerelease: true

    - name: 📤 GitHub Release에 APK 업로드
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.apk_info.outputs.apk_path }}
        asset_name: ${{ steps.apk_info.outputs.apk_name }}
        asset_content_type: application/vnd.android.package-archive

    - name: 🚀 Discord로 다운로드 링크 전송
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        RELEASE_URL: ${{ steps.create_release.outputs.html_url }}
        APK_SIZE: ${{ steps.apk_info.outputs.apk_size }}
        APK_NAME: ${{ steps.apk_info.outputs.apk_name }}
        APP_VERSION: ${{ steps.version_info.outputs.release_version }}
        VERSION_CODE: ${{ steps.version_info.outputs.version_code }}
        BRANCH_NAME: ${{ steps.version_info.outputs.branch_name }}
      run: |
        if [ -z "$DISCORD_WEBHOOK_URL" ]; then
          echo "❌ DISCORD_WEBHOOK_URL secret not found. Please add Discord webhook URL to repository secrets."
          exit 1
        fi
        
        # APK 다운로드 직링크 생성
        DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.version_info.outputs.tag_name }}/${{ steps.apk_info.outputs.apk_name }}"
        
        # Discord embed 메시지 생성
        EMBED_JSON=$(cat << EOF
        {
          "embeds": [
            {
              "title": "🚀 WePLi Android Debug APK 배포",
              "description": "새로운 Release 브랜치에서 Debug APK가 빌드되었습니다!",
              "color": 5814783,
              "fields": [
                {
                  "name": "📱 APK 정보",
                  "value": "**버전**: v${APP_VERSION}\n**파일명**: \`${APK_NAME}\`\n**크기**: \`${APK_SIZE}\`",
                  "inline": true
                },
                {
                  "name": "🌿 브랜치",
                  "value": "\`${BRANCH_NAME}\`",
                  "inline": true
                },
                {
                  "name": "📅 빌드 시간",
                  "value": "\`$(date '+%Y-%m-%d %H:%M:%S')\`",
                  "inline": true
                },
                {
                  "name": "📥 다운로드",
                  "value": "[**🔗 GitHub Release에서 다운로드**](${RELEASE_URL})\n\n[**⬇️ APK 직접 다운로드**](${DOWNLOAD_URL})",
                  "inline": false
                }
              ],
              "footer": {
                "text": "WePLi Android • GitHub Actions",
                "icon_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
              },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            }
          ]
        }
        EOF
        )
        
        # Discord에 메시지 전송
        curl -H "Content-Type: application/json" \
             -d "${EMBED_JSON}" \
             "${DISCORD_WEBHOOK_URL}"
        
        echo "✅ APK download link successfully sent to Discord!"