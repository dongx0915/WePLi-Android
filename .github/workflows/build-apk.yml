name: Android APK 빌드

on:
  workflow_call:
    inputs:
      branch-name:
        required: false
        type: string
        default: ""
    outputs:
      apk-path:
        description: "빌드된 APK 파일 경로"
        value: ${{ jobs.build.outputs.apk-path }}
      apk-size:
        description: "APK 파일 크기"
        value: ${{ jobs.build.outputs.apk-size }}
      apk-name:
        description: "APK 파일명"
        value: ${{ jobs.build.outputs.apk-name }}
      app-version:
        description: "앱 버전"
        value: ${{ jobs.build.outputs.app-version }}
      version-code:
        description: "버전 코드"
        value: ${{ jobs.build.outputs.version-code }}
      tag-name:
        description: "릴리스 태그명"
        value: ${{ jobs.build.outputs.tag-name }}
      release-url:
        description: "GitHub 릴리스 URL"
        value: ${{ jobs.build.outputs.release-url }}

jobs:
  # 1단계: 환경 준비 (병렬 실행)
  setup:
    runs-on: ubuntu-latest
    
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
      
    steps:
    - name: 📥 저장소 체크아웃
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔑 캐시 키 생성
      id: cache-key
      run: |
        echo "key=${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}" >> $GITHUB_OUTPUT

    - name: 💾 Gradle 패키지 캐시
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: 🔑 Gradlew 실행 권한 부여
      run: chmod +x gradlew

  # 2단계: 파일 준비 (병렬 실행)
  prepare-files:
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
    - name: 📥 저장소 체크아웃
      uses: actions/checkout@v4

    - name: 📄 필수 파일 준비
      uses: ./.github/actions/prepare-files
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_CLIENT_ID: ${{ secrets.SUPABASE_CLIENT_ID }}
        APPLE_MUSIC_URL: ${{ secrets.APPLE_MUSIC_URL }}
        APPLE_MUSIC_API_TOKEN: ${{ secrets.APPLE_MUSIC_API_TOKEN }}
        POSTMAN_URL: ${{ secrets.POSTMAN_URL }}

    - name: 💾 설정 파일 업로드
      uses: actions/upload-artifact@v4
      with:
        name: config-files
        path: |
          app/google-services.json
          local.properties
        retention-days: 1

  # 3단계: Java 환경 설정 (병렬 실행)
  setup-java:
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
    - name: 📥 저장소 체크아웃
      uses: actions/checkout@v4
      
    - name: ⚙️ Android 환경 설정
      uses: ./.github/actions/setup-android
      with:
        java-version: '17'
        gradle-cache: 'false'

    - name: 📋 Java 환경 정보 저장
      run: |
        echo "JAVA_HOME=$JAVA_HOME" > java-env.txt
        echo "PATH=$PATH" >> java-env.txt

    - name: 💾 Java 환경 업로드
      uses: actions/upload-artifact@v4
      with:
        name: java-env
        path: java-env.txt
        retention-days: 1

  # 4단계: 의존성 다운로드 (병렬 실행)
  download-dependencies:
    runs-on: ubuntu-latest
    needs: [setup, prepare-files, setup-java]
    
    steps:
    - name: 📥 저장소 체크아웃
      uses: actions/checkout@v4

    - name: ⚙️ Android 환경 설정
      uses: ./.github/actions/setup-android
      with:
        java-version: '17'
        gradle-cache: 'true'

    - name: 📦 설정 파일 다운로드
      uses: actions/download-artifact@v4
      with:
        name: config-files
        path: .

    - name: 📦 의존성 다운로드
      run: ./gradlew dependencies --no-daemon

  # 5단계: 실제 빌드 (의존성 준비 후 실행)
  build:
    runs-on: ubuntu-latest
    needs: [setup, prepare-files, setup-java, download-dependencies]
    
    outputs:
      apk-path: ${{ steps.build-info.outputs.apk-path }}
      apk-size: ${{ steps.build-info.outputs.apk-size }}
      apk-name: ${{ steps.build-info.outputs.apk-name }}
      app-version: ${{ steps.version-info.outputs.release-version }}
      version-code: ${{ steps.version-info.outputs.version-code }}
      tag-name: ${{ steps.version-info.outputs.tag-name }}
      release-url: ${{ steps.create-release.outputs.html_url }}
      
    steps:
    - name: 📥 저장소 체크아웃
      uses: actions/checkout@v4

    - name: ⚙️ Android 환경 설정
      uses: ./.github/actions/setup-android
      with:
        java-version: '17'
        gradle-cache: 'true'

    - name: 📦 설정 파일 다운로드
      uses: actions/download-artifact@v4
      with:
        name: config-files
        path: .

    - name: 🔨 Debug APK 빌드
      run: ./gradlew assembleDebug --no-daemon --parallel --build-cache

    - name: 📱 APK 정보 수집
      id: build-info
      run: |
        APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
        APK_NAME=$(basename "$APK_PATH")
        
        echo "apk-path=${APK_PATH}" >> $GITHUB_OUTPUT
        echo "apk-size=${APK_SIZE}" >> $GITHUB_OUTPUT
        echo "apk-name=${APK_NAME}" >> $GITHUB_OUTPUT

    - name: 📋 앱 버전 정보 추출
      id: version-info
      run: |
        APP_VERSION=$(grep "appVersion" gradle/libs.versions.toml | cut -d'"' -f2)
        VERSION_CODE=$(grep "versionCode" gradle/libs.versions.toml | cut -d'"' -f2)
        
        # 브랜치 이름 확인 및 디버깅
        BRANCH_NAME="${{ inputs.branch-name }}"
        echo "DEBUG: 입력받은 브랜치명: $BRANCH_NAME"
        
        if [ -n "$BRANCH_NAME" ] && [[ "$BRANCH_NAME" =~ ^release/(.+)$ ]]; then
          RELEASE_VERSION="${BASH_REMATCH[1]}"
          echo "DEBUG: 릴리스 브랜치에서 추출한 버전: $RELEASE_VERSION"
        else
          RELEASE_VERSION="$APP_VERSION"
          echo "DEBUG: 기본 앱 버전 사용: $RELEASE_VERSION"
        fi
        
        # 태그 이름 생성 (항상 타임스탬프 포함)
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        TAG_NAME="v${RELEASE_VERSION}-debug-${TIMESTAMP}"
        echo "DEBUG: 생성된 태그명: $TAG_NAME"
        
        echo "release-version=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
        echo "version-code=${VERSION_CODE}" >> $GITHUB_OUTPUT
        echo "tag-name=${TAG_NAME}" >> $GITHUB_OUTPUT

    - name: 📦 GitHub Release 생성
      id: create-release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version-info.outputs.tag-name }}
        release_name: 🚀 WePLi APK v${{ steps.version-info.outputs.release-version }}
        body: |
          ## 🚀 WePLi Android Apk
          
          ### 📱 APK 정보
          - **버전**: v${{ steps.version-info.outputs.release-version }}
          - **버전 코드**: ${{ steps.version-info.outputs.version-code }}
          - **파일명**: `${{ steps.build-info.outputs.apk-name }}`
          - **크기**: ${{ steps.build-info.outputs.apk-size }}
          - **브랜치**: ${{ inputs.branch-name }}
          
          ### 📅 빌드 정보
          - **빌드 시간**: $(date '+%Y-%m-%d %H:%M:%S')
          - **빌드 환경**: GitHub Actions
          
          ### 📥 다운로드
          아래 Assets에서 APK 파일을 다운로드할 수 있습니다.
          
          ---
          🤖 *Automated by GitHub Actions*
        draft: false
        prerelease: true

    - name: 📤 GitHub Release에 APK 업로드
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create-release.outputs.upload_url }}
        asset_path: ${{ steps.build-info.outputs.apk-path }}
        asset_name: ${{ steps.build-info.outputs.apk-name }}
        asset_content_type: application/vnd.android.package-archive

    - name: 💾 APK 파일 업로드
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: ${{ steps.build-info.outputs.apk-path }}
        retention-days: 1