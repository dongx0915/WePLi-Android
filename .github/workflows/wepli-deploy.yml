name: Debug APK 자동 배포 (Discord)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  # APK 빌드 (재활용 가능한 워크플로우 호출)
  build:
    uses: ./.github/workflows/build-apk.yml
    with:
      branch-name: ${{ github.ref_name }}
    secrets: inherit
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'create' && github.ref_type == 'branch' && startsWith(github.ref_name, 'release/'))

  # Discord 알림 (재활용 가능한 워크플로우 호출)
  discord-notify:
    needs: build
    uses: ./.github/workflows/discord-notify.yml
    with:
      release-url: ${{ needs.build.outputs.release-url }}
      apk-size: ${{ needs.build.outputs.apk-size }}
      apk-name: ${{ needs.build.outputs.apk-name }}
      app-version: ${{ needs.build.outputs.app-version }}
      version-code: ${{ needs.build.outputs.version-code }}
      branch-name: ${{ github.ref_name }}
      tag-name: ${{ needs.build.outputs.tag-name }}
    secrets: inherit
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'create' && github.ref_type == 'branch' && startsWith(github.ref_name, 'release/'))

  # 정리 작업
  cleanup:
    runs-on: ubuntu-latest
    needs: [build, discord-notify]
    if: always()
    
    steps:
    - name: 📥 저장소 체크아웃
      uses: actions/checkout@v4
      
    - name: 🧹 아티팩트 정리
      uses: ./.github/actions/cleanup-artifacts